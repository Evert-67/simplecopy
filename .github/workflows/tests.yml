name: Simple Copy tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: wp-cli
          coverage: none
      - name: PHP syntax
        run: find simple-copy-button tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check simple-copy-button/assets/simple-copy-button.js
      - name: Install WordPress and activate plugin
        run: |
          mkdir /tmp/simplecopy-wp
          wp core download --path=/tmp/simplecopy-wp --version=6.8.3
          wp config create --path=/tmp/simplecopy-wp --dbname=wordpress --dbuser=root --dbpass=testing --dbhost=127.0.0.1:3306
          wp core install --path=/tmp/simplecopy-wp --url=http://localhost --title=SimpleCopy-test --admin_user=testadmin --admin_password=local-ci-only --admin_email=test@example.invalid --skip-email
          zip -qr /tmp/simple-copy-button-install.zip simple-copy-button
          wp plugin install /tmp/simple-copy-button-install.zip --activate --path=/tmp/simplecopy-wp
      - name: WordPress shortcode tests
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress.php" --path=/tmp/simplecopy-wp
  browser:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Select browser
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "SCB_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm test
  package:
    needs: [wordpress, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build installable ZIP
        run: zip -qr simple-copy-button-1.2.1.zip simple-copy-button
      - uses: actions/upload-artifact@v4
        with:
          name: simple-copy-button-1.2.1
          path: simple-copy-button-1.2.1.zip

  release:
    needs: [package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-1.2.1
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simple-copy-button-1.2.1
          path: dist
      - name: Check plugin archive
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/simple-copy-button-1.2.1.zip') as archive:
              files = archive.namelist()
              assert 'simple-copy-button/simple-copy-button.php' in files
              assert all(name.startswith('simple-copy-button/') for name in files)
              assert archive.testzip() is None
          PY
      - name: Publish installable WordPress ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view v1.2.1 > /dev/null 2>&1; then
            echo "Release v1.2.1 already exists; preserving published assets."
          else
            gh release create v1.2.1 "dist/simple-copy-button-1.2.1.zip" --target "$RELEASE_COMMIT" --title "Simple Copy Button 1.2.1" --notes "Download simple-copy-button-1.2.1.zip below and upload it directly in WordPress via Plugins > Add New > Upload Plugin. Do not use the automatically generated Source code archives. Automated tests include installing and activating the packaged ZIP in WordPress." --latest
          fi
